# ── Notification mode ─────────────────────────────────────────────────────────
# "stdout" (default): each would-be Telegram message is printed to stdout with
#   ===COMMUTECOMPASS-MSG=== ... ===COMMUTECOMPASS-END=== markers. Pipe through
#   contrib/openclaw-send.sh to relay via your OpenClaw bot. TELEGRAM_BOT_TOKEN
#   and TELEGRAM_CHAT_ID are unused in this mode.
# "telegram":         POST directly to the Telegram Bot API (legacy single-bot
#   deployment). Requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in the env.
[notify]
mode = "stdout"

[origin]
address = "123 Example Ave, Brooklyn, NY 11201"
lat = 40.6950
lon = -73.9890
subway_station = "Jay St-MetroTech"
lirr_station = "Atlantic Terminal"

[prep]
prep_minutes = 20
safety_buffer_minutes = 5
# Get-ready lead (ping + wake alarm) for video-call events with no location.
virtual_prep_minutes = 15

[scheduling]
morning_run_time = "06:00"
poll_interval_seconds = 60
quiet_hours_start = "22:00"
quiet_hours_end = "07:00"

[weather]
# Pad the departure buffer when rain/snow is expected around the commute, using
# the free keyless Open-Meteo forecast.  Disabled by default.
enabled = false
rain_buffer_minutes = 10
snow_buffer_minutes = 20
precip_probability_threshold = 50

[realtime]
# Fresh measured delays require independently validated GTFS trip/boarding
# identity. Normal Directions plans lack that mapping: automatic padding is
# currently unsupported for those plans (zero is unknown, not on-time).
# `realtime` is read-only; fetch/parse failures, even partial, exit 75.
# Normal poll refreshes pending alarms before dispatch within -15..+60 minutes
# of leave_at. Only increased observed buffers move alarms earlier, never later.
# Five-second per-system fetch admission budget; usable partial results survive.
# Disabled by default.  Feed URLs default to the current MTA endpoints — verify
# against https://api.mta.info if matching stops working.
enabled = false
max_buffer_minutes = 15
min_delay_minutes = 2
match_window_minutes = 30
# No nearest-departure inference: match_window_minutes cannot prove identity.
fuzzy_threshold = 80
# Fuzzy station names support information only, never measured alarm padding.
# subway_tripupdate_urls / lirr_tripupdate_url / bus_tripupdate_url default to
# the canonical MTA + OneBusAway trip-update feeds; override only if they move.

[monitoring]
# Optional dead-man's-switch.  poll_staleness_minutes controls how long the poll
# loop may be silent before the morning digest warns the timer is dead.  Set
# heartbeat_url to a healthchecks.io-style URL to get an off-host alert when the
# per-minute poll stops pinging it entirely.
poll_staleness_minutes = 15
# heartbeat_url = "https://hc-ping.com/your-uuid-here"

[paths]
venues_file = "/etc/commutecompass/known_venues.yaml"
db_path = "/var/lib/commutecompass/state.db"
oauth_token_path = "/var/lib/commutecompass/google_token.json"
# Static GTFS index written by `commutecompass gtfs-refresh` (identity bridge).
# Optional; defaults to gtfs.db next to db_path.
# gtfs_db_path = "/var/lib/commutecompass/gtfs.db"

[opencode_go]
endpoint = "https://opencode-go.example/v1/chat/completions"
model = "deepseek-v4-flash"

[mta]
subway_alerts_url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Fsubway-alerts"
lirr_alerts_url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Flirr-alerts"
bus_alerts_url = "https://gtfsrt.prod.obanyc.com/alerts"

# ── Home Assistant integration (optional) ─────────────────────────────────────
# When enabled, each poll-tick pulls the tracker entity's latest state from HA.
# If the fix is fresh and accurate enough:
#   - state matches a [[home_assistant.zone_origins]] entry → that origin is
#     used (with its subway/LIRR hints)
#   - state matches home_zone → [origin] above is used
#   - otherwise → the live GPS coords are used as the trip origin
# Within replan_window_minutes of an event's leave time the poll job re-plans
# against the live location and pushes a Telegram update if the route shifts
# by ≥ 5 min. Requires HOME_ASSISTANT_TOKEN in the env.
#
# `entity_id` may be either a `device_tracker.*` or a `person.*` — both expose
# `state` + `attributes.latitude/longitude`. `person.*` is recommended because
# it aggregates multiple device trackers under one entity.
#
# Calendar events whose location text exactly matches one of HA's zone
# friendly_names (case-insensitive) also short-circuit the geocoder — handy
# for recurring events at "Office", "Madison Theatre", etc.
[home_assistant]
enabled = false
base_url = "http://homeassistant.local:8123"
entity_id = "person.example"
home_zone = "home"
max_age_minutes = 30
replan_window_minutes = 30
# Reject GPS fixes whose reported accuracy is worse than this many metres.
# Set to 0 to disable the filter entirely.
min_gps_accuracy_meters = 500

# Per-zone origin overrides — when the tracker is in a matched zone, planning
# uses this Origin instead of the live GPS coords, so non-home zones still get
# subway/LIRR station hints just like the home origin.
#
# `zone` is compared case-insensitively against the HA zone's friendly_name.
# [[home_assistant.zone_origins]]
# zone = "work"
# address = "200 W Street, New York, NY"
# lat = 40.7346
# lon = -74.0055
# subway_station = "34 St-Penn Station"
#
# [[home_assistant.zone_origins]]
# zone = "cap21"
# address = "18 Bridge St, New York, NY"
# lat = 40.7062
# lon = -74.0124

# ── Home Assistant alarm channel (optional, additive) ────────────────────────
# When enabled, each prep/leave ping ALSO POSTs to an HA service so HA can
# wake you up with a real alarm (Pushcut, looping critical notification,
# media_player on a HomePod — whatever you wire up inside HA itself).  The
# existing notify channel (Telegram/stdout) keeps firing as before; this is
# additive.  Reuses [home_assistant].base_url and HOME_ASSISTANT_TOKEN.
#
# `service` is the HA service to call as "domain.service".  Pointing at a
# script.* you own (rather than directly at notify.mobile_app_*) lets you
# evolve the alarm chain without touching commutecompass config.
#
# `extra_data` is merged into the JSON body POSTed to HA; use it to set
# Pushcut sound names, mobile_app critical-push flags, tags, etc.
# [home_assistant.alarm]
# enabled = true
# service = "script.commute_alarm"   # call your HA-side alarm script
# kinds = ["prep", "leave"]          # ping kinds that trigger the alarm
# [home_assistant.alarm.extra_data]
# # title = "Get moving!"           # overrides the default "CommuteCompass"
# # Example pass-through for HA Companion app critical push (iOS):
# # [home_assistant.alarm.extra_data.data.push.sound]
# # critical = 1
# # volume = 1.0
# # name = "alarm.caf"

# ── Home Assistant tomorrow-alarm pull channel (optional) ────────────────────
# Pull-model alarm. The `commutecompass tomorrow` subcommand (run on an
# evening systemd timer ~21:00) plans tomorrow's events, picks the earliest
# prep_at, and POSTs it to the HA script below. The script writes that value
# into an input_datetime helper that an iOS Shortcut polls on its own
# schedule to create a wake-up alarm on-device. Reuses [home_assistant]
# .base_url and HOME_ASSISTANT_TOKEN.
#
# See examples/ha/commute_tomorrow_alarm.yaml for the matching HA YAML
# (input_datetime helper + script) and the Shortcuts recipe.
# [home_assistant.tomorrow]
# enabled = true
# script  = "script.commute_set_tomorrow_alarm"
# [home_assistant.tomorrow.extra_data]
# # label = "commute"   # merged into the JSON body POSTed to HA

[[calendars]]
id = "theatre-calendar@example.com"
name = "Theatre"

[[calendars]]
id = "school-calendar@example.com"
name = "School"

[[calendars]]
id = "personal-calendar@example.com"
name = "Example User"

[[calendars]]
id = "parties-calendar@example.com"
name = "Parties"

[[calendars]]
id = "job-calendar@example.com"
name = "Job"

# ── Location Overrides ─────────────────────────────────────────────────────────
# Map events from specific calendars to a fixed destination, bypassing
# placeholder/LLM resolution. Useful when a calendar always meets at the
# same location even if the event text says "Location available once RSVP'd".
#
[[location_overrides]]
calendar_id = "job-calendar@example.com"
location = "200 Example St, New York, NY 10001"
# # title_contains is optional — omit to override ALL events in that calendar.
# # title_contains = "Office Hours"

# ── Travel-Mode Overrides ───────────────────────────────────────────────────
# Force a travel mode for any event whose (effective) location contains the
# given text, case-insensitive. First match wins. Handy for "always bike to
# work" — the digest then shows the bike duration instead of a transit route.
# Valid modes: "transit", "driving", "walking", "bicycling".
#
[[mode_overrides]]
location_contains = "200 Example St"
mode = "bicycling"

# ── Wake & nap alarm (HA owns nap caps and final next-alarm selection) ──────────
[alarm]
enabled = false
fallback_time = "12:00"          # HH:MM NYC; latest morning wake, even without events
wake_lead_minutes = 0
publish_script = "script.commute_publish_alarm"
# Opt-in repair contract: stage/review HA consumers before separately approved activation.
# See docs/alarm-ha-contract.md. Missing v1 state never falls back to legacy.
schedule_contract = "legacy"
schedule_entity = "input_text.commute_alarm_schedule_v1"
contract_entity = "input_select.commute_alarm_contract"
publish_v1_script = "script.commute_publish_alarm_v1"
status_entity = ""               # opt-in advisory export: sensor.commute_alarm_status
nap_script = "script.commute_nap"
skip_script = "script.commute_alarm_skip"
next_alarm_entity = "sensor.commute_next_alarm"
enabled_entity = "input_boolean.commute_alarm_enabled"
stop_button = "input_button.commute_alarm_stop"
snooze_button = "input_button.commute_alarm_snooze"
state_entity = "input_select.commute_alarm_state"
heartbeat_entity = "input_datetime.commute_alarm_heartbeat"
wake_entity = "input_datetime.commute_wake_at"
nap_entity = "input_datetime.commute_nap_at"
skipped_entity = "input_datetime.commute_alarm_skipped_at"
next_prep_entity = "input_datetime.commute_next_prep_at" # cap; wake lead already applied
wake_utc_entity = "input_text.commute_wake_utc" # authoritative instants; survive DST folds
nap_utc_entity = "input_text.commute_nap_utc"
skipped_utc_entity = "input_text.commute_alarm_skipped_utc"
next_prep_utc_entity = "input_text.commute_next_prep_utc"
handled_entity = "input_text.commute_alarm_handled_at"
heartbeat_utc_entity = "input_text.commute_alarm_heartbeat_utc"
audio_failed_entity = "input_boolean.commute_alarm_audio_failed"
stop_on_activity = true           # keyboard/mouse on link stops; requires Wayland idle support
wayland_display = ""              # WAYLAND_DISPLAY env, then runtime socket discovery
sink = "analog"                  # PipeWire sink name/description substring (not Living Room)
sound = ""                       # empty = synthesized tone, otherwise a sound file path
ramp_start_percent = 30
ramp_seconds = 120
max_ring_minutes = 15
snooze_minutes = 9
max_snoozes = 2
poll_seconds = 30
cache_path = ""                  # empty = <db dir>/alarm-cache.json

# Commute wake window anchored on a healthy plan's buffered leave_at deadline.
# Both leads below are relative to leave_at, not informational depart_at:
# safety/weather/realtime buffers therefore move the entire window earlier.
# Upstream HA contract only: lights at leave_at-47m (100% over 10m).
# Naps and fallback wakes keep the snooze/ring settings above.
[alarm.window]
enabled = true
deadline_utc_entity = "input_text.commute_alarm_deadline_utc"
window_done_entity = "input_text.commute_alarm_window_done_utc" # empty = don't publish
first_alarm_lead_minutes = 37    # first alarm at leave_at-37m
deadline_lead_minutes = 0        # final, unsnoozable alarm at leave_at
snooze_minutes = 5               # unlimited; the last snooze is cut to end at the deadline
rering_start_percent = 20        # re-rings hold here (absolute sink level) ...
rering_hold_seconds = 30
rering_ramp_seconds = 60         # ... then ramp to 100%

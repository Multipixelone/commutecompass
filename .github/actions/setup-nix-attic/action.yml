name: Setup Nix and Attic
description: Install Nix and configure the Attic system cache as a substituter.

inputs:
  attic-key:
    description: Optional Attic auth token (write access); omit to skip cache setup.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        extra-conf: |
          accept-flake-config = true

    - name: Install attic-client
      if: ${{ inputs.attic-key != '' }}
      shell: bash
      run: nix profile install nixpkgs#attic-client

    - name: Login to Attic
      if: ${{ inputs.attic-key != '' }}
      shell: bash
      env:
        ATTIC_KEY: ${{ inputs.attic-key }}
      run: attic login fly https://attic-cache.fly.dev "$ATTIC_KEY"

    - name: Use system cache as substituter
      if: ${{ inputs.attic-key != '' }}
      shell: bash
      run: attic use system
